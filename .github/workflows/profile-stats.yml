name: Refresh profile cards
on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
  push:
    paths:
      - 'tools/update_stats.py'
      - 'tests/test_stats.py'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
      - run: python tools/update_stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit changed cards
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/languages.svg assets/overview.svg
          if ! git diff --cached --quiet; then
            git commit -m "Refresh public GitHub statistics"
            git push
          fi
